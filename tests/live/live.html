<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Medura live Supabase harness</title>
  <script src="../../js/vendor/supabase.umd.js"></script>
</head>
<body>
  <p>live harness</p>
  <script type="module">
    import { createSupabaseApi } from '../../js/api/supabase-api.js';
    window.makeApi = (url, anonKey) => {
      const api = createSupabaseApi({ url, anonKey });
      window.api = api;
      return true;
    };
    window.rawClient = () => globalThis.supabase.createClient(window.__url, window.__key, {
      auth: { persistSession: true, storageKey: 'medura-auth' },
    });
    window.__ready = true;
  </script>
</body>
</html>
